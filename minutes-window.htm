<!doctype html>
<html
  window-frame="solid-with-shadow"
  window-width="760dip"
  window-height="840dip"
  window-min-width="620dip"
  window-min-height="640dip"
  theme="light"
>
  <head>
    <meta charset="utf-8" />
    <title>量界智擎会议助手 - 会议纪要</title>
    <style>
      :root {
        color-scheme: light;
        font: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #d8e3ef;
        background: #0d1825;
      }

      html,
      body {
        margin: 0;
        width: *;
        height: *;
        background:
          linear-gradient(180deg, rgba(20, 33, 51, 0.96), rgba(9, 17, 28, 0.98)),
          #0d1825;
      }

      body {
        overflow: hidden;
      }

      .shell {
        flow: vertical;
        width: *;
        height: *;
        padding: 22dip;
        border-spacing: 16dip;
      }

      .header {
        flow: vertical;
        border-spacing: 8dip;
        padding: 18dip 20dip;
        border-radius: 20dip;
        background: rgba(255, 255, 255, 0.06);
        border: 1dip solid rgba(255, 255, 255, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 24dip;
      }

      .meta {
        color: rgba(216, 227, 239, 0.72);
        font-size: 12dip;
      }

      .content {
        width: *;
        height: *;
        padding: 20dip;
        border-radius: 20dip;
        background: rgba(6, 14, 24, 0.82);
        border: 1dip solid rgba(255, 255, 255, 0.08);
        overflow: auto;
        white-space: pre-wrap;
        font-size: 14dip;
        line-height: 1.65;
      }
    </style>
    <script>
      function bootstrapMinutesWindow() {
        const payload = Window.this.parameters || {};
        document.title = payload.title ? `${payload.title} - 量界智擎会议助手` : "量界智擎会议助手 - 会议纪要";
        document.querySelector("#title").textContent = payload.title || "未命名会议";
        document.querySelector("#meta").textContent =
          `${payload.startedAtLabel || ""}  ${payload.endedAtLabel ? `至 ${payload.endedAtLabel}` : ""}`.trim();
        document.querySelector("#content").textContent = payload.minutes || "暂无会议纪要";
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bootstrapMinutesWindow);
      } else {
        bootstrapMinutesWindow();
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <section class="header">
        <h1 id="title">会议纪要</h1>
        <div id="meta" class="meta"></div>
      </section>
      <section id="content" class="content">暂无会议纪要</section>
    </main>
  </body>
</html>
