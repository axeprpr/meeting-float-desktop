<!doctype html>
<html
  window-frame="solid-with-shadow"
  window-title="Meeting Float"
  window-width="700dip"
  window-height="860dip"
  window-min-width="560dip"
  window-min-height="720dip"
  theme="light"
>
  <head>
    <meta charset="utf-8" />
    <title>Meeting Float</title>
    <link rel="stylesheet" href="app.css" />
    <script>
      globalThis.__MEETING_FLOAT_AUTOTEST__ = true;
    </script>
    <script type="module">
      import * as sys from "@sys";
      import * as env from "@env";

      const debugLogPath = `${env.TMPDIR || env.TEMP || env.TMP || "/tmp"}/meeting-float-debug.log`;

      function appendDebugLog(message) {
        try {
          const file = sys.fs.openSync(debugLogPath, "a");
          file.writeSync(new TextEncoder().encode(`${new Date().toISOString()} ${message}\n`));
          file.closeSync();
        } catch (error) {
          console.log(String(error));
        }
      }

      globalThis.__mfDebugLog = appendDebugLog;
      appendDebugLog("bootstrap:start");

      import("./app.js")
        .then(() => appendDebugLog("bootstrap:app-loaded"))
        .catch((error) => {
          appendDebugLog(`bootstrap:error:${error?.stack || error}`);
          const statusLine = document.querySelector("#statusLine");
          if (statusLine) {
            statusLine.textContent = "启动失败，请看日志";
          }
        });
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand" role="window-caption">
          <div class="brand-mark"></div>
          <div class="brand-copy">
            <div class="eyebrow">Enterprise Meeting Assistant</div>
            <h1>Meeting Float</h1>
            <p id="statusLine">待命</p>
          </div>
        </div>
        <div class="window-actions">
          <button id="minimizeBtn" class="window-btn" title="最小化到托盘">_</button>
          <button id="closeBtn" class="window-btn danger" title="关闭">×</button>
        </div>
      </header>

      <section class="view-switch">
        <button class="nav-chip active" data-view="overview">概览</button>
        <button class="nav-chip" data-view="history">历史记录</button>
        <button class="nav-chip" data-view="settings">设置</button>
      </section>

      <section id="overviewView" class="page view-page">
        <section class="hero-card">
          <div class="hero-copy">
            <div id="sessionStageBadge" class="stage-badge idle">待命中</div>
            <div id="sessionTitle" class="hero-title">未开始会议</div>
            <div class="hero-meta">
              <span id="modePill" class="info-pill">标准模式</span>
              <span id="runtimePill" class="info-pill subtle">运行时检测中</span>
            </div>
          </div>
          <div class="timer-cluster">
            <div id="recordDot" class="record-dot idle"></div>
            <div id="timerText" class="timer-text">00:00:00</div>
            <div id="sessionStats" class="timer-subtext">0 段转写 · 0 次总结</div>
          </div>
        </section>

        <section class="command-bar">
          <button id="startBtn" class="primary">开始会议</button>
          <button id="pauseBtn" class="secondary" disabled>暂停</button>
          <button id="stopBtn" class="danger" disabled>结束会议</button>
          <button id="viewMinutesBtn" class="ghost" disabled>查看会议纪要</button>
        </section>

        <section class="panel focus-panel">
          <div class="panel-head">
            <div class="focus-tabs">
              <button id="summaryTabBtn" class="focus-tab active" data-focus="summary">
                阶段总结
              </button>
              <button id="transcriptTabBtn" class="focus-tab" data-focus="transcript">
                最新记录
              </button>
            </div>
          </div>
          <div id="summaryFocusBox" class="scroll-box focus-box">
            <div class="placeholder">会议进行后，这里显示阶段性总结。</div>
          </div>
          <div id="transcriptFocusBox" class="scroll-box focus-box hidden">
            <div class="placeholder">会议进行后，这里显示最新转写记录。</div>
          </div>
        </section>

        <section class="panel minutes-preview-panel">
          <div class="panel-head">
            <h2>会议纪要</h2>
            <div class="panel-caption">结束会议后会再次调用 LLM 生成正式纪要</div>
          </div>
          <div id="minutesPreviewBox" class="scroll-box minutes-preview-box">
            <div class="placeholder">纪要将在会议结束后生成。</div>
          </div>
        </section>
      </section>

      <section id="historyView" class="page view-page hidden">
        <section class="panel history-panel">
          <div class="panel-head">
            <h2>历史记录</h2>
            <div class="panel-actions">
              <button id="refreshHistoryBtn" class="ghost compact">刷新</button>
            </div>
          </div>
          <div class="history-table-wrap">
            <table class="history-table">
              <thead>
                <tr>
                  <th>标题</th>
                  <th>时间</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr>
                  <td colspan="2" class="placeholder-cell">还没有历史会议。</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>

      <section id="settingsView" class="page view-page hidden">
        <section class="panel settings-hero">
          <div class="panel-head">
            <h2>模型配置</h2>
            <div class="panel-actions">
              <button id="saveConfigBtn" class="primary compact">保存配置</button>
            </div>
          </div>
          <div id="settingsSaveState" class="save-state">尚未保存本轮修改。</div>
        </section>

        <section class="panel settings-panel">
          <div class="settings-group">
            <div class="settings-group-head">
              <div class="group-title">语音转文字 STT</div>
              <button id="testSttBtn" class="ghost compact">测试</button>
            </div>
            <div id="sttProbeState" class="probe-state">还没有测试 STT。</div>
            <div class="grid two">
              <label>
                <span>Base URL</span>
                <input id="sttBaseUrlInput" type="text" placeholder="https://api.example.com/v1" />
              </label>
              <label>
                <span>Model</span>
                <input id="sttModelInput" type="text" placeholder="whisper-1" />
              </label>
            </div>
            <div class="grid two">
              <label>
                <span>API Key</span>
                <input id="sttApiKeyInput" type="password" placeholder="可为空" />
              </label>
              <label>
                <span>Language</span>
                <input id="languageInput" type="text" placeholder="zh" />
              </label>
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-group-head">
              <div class="group-title">大语言模型 LLM</div>
              <button id="testLlmBtn" class="ghost compact">测试</button>
            </div>
            <div id="llmProbeState" class="probe-state">还没有测试 LLM。</div>
            <div class="grid two">
              <label>
                <span>Base URL</span>
                <input id="llmBaseUrlInput" type="text" placeholder="https://api.example.com/v1" />
              </label>
              <label>
                <span>Model</span>
                <input id="llmModelInput" type="text" placeholder="gpt-4o-mini" />
              </label>
            </div>
            <label>
              <span>API Key</span>
              <input id="llmApiKeyInput" type="password" placeholder="可为空" />
            </label>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
