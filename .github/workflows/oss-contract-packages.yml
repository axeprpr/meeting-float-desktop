name: OSS contract package multipart

on:
  workflow_dispatch:
    inputs:
      operation:
        description: initiate or complete
        required: true
        type: choice
        options: [initiate, complete]
      payload_json:
        description: Operation payload
        required: true
        type: string
      recipient_public_key:
        description: Base64-encoded PEM public key for encrypted output
        required: false
        type: string

permissions:
  contents: read

jobs:
  multipart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run multipart operation
        env:
          OPERATION: ${{ inputs.operation }}
          PAYLOAD_JSON: ${{ inputs.payload_json }}
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet cryptography oss2
          python <<'PY'
          import base64
          import json
          import os
          from pathlib import PurePosixPath

          import oss2
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          operation = os.environ["OPERATION"]
          payload = json.loads(os.environ["PAYLOAD_JSON"])
          prefix = os.environ.get("ALIYUN_OSS_PREFIX", "").strip().strip("/")
          endpoint = os.environ["ALIYUN_OSS_ENDPOINT"].strip()
          bucket_name = os.environ["ALIYUN_OSS_BUCKET"].strip()
          auth = oss2.Auth(
              os.environ["ALIYUN_ACCESS_KEY_ID"].strip(),
              os.environ["ALIYUN_ACCESS_KEY_SECRET"].strip(),
          )
          bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name)

          def object_key(relative_key):
              path = PurePosixPath(relative_key)
              if path.is_absolute() or ".." in path.parts or not path.parts:
                  raise SystemExit(f"invalid key: {relative_key}")
              return "/".join(filter(None, (prefix, "ai-delivery", "contract-packages", str(path))))

          if operation == "initiate":
              results = []
              for item in payload:
                  key = object_key(item["key"])
                  size = int(item["size"])
                  part_size = int(item.get("part_size", 1024 * 1024 * 1024))
                  upload_id = bucket.init_multipart_upload(key).upload_id
                  part_count = (size + part_size - 1) // part_size
                  urls = []
                  for part_number in range(1, part_count + 1):
                      urls.append(bucket.sign_url(
                          "PUT",
                          key,
                          86400,
                          params={"uploadId": upload_id, "partNumber": str(part_number)},
                          slash_safe=True,
                      ))
                  results.append({
                      "relative_key": item["key"],
                      "key": key,
                      "size": size,
                      "part_size": part_size,
                      "upload_id": upload_id,
                      "part_urls": urls,
                      "download_url": f"https://{bucket_name}.{endpoint}/{key}",
                  })

              public_key = serialization.load_pem_public_key(
                  base64.b64decode(os.environ["RECIPIENT_PUBLIC_KEY"])
              )
              plaintext = json.dumps(results, ensure_ascii=False).encode("utf-8")
              data_key = AESGCM.generate_key(bit_length=256)
              nonce = os.urandom(12)
              ciphertext = AESGCM(data_key).encrypt(nonce, plaintext, None)
              encrypted_key = public_key.encrypt(
                  data_key,
                  padding.OAEP(
                      mgf=padding.MGF1(algorithm=hashes.SHA256()),
                      algorithm=hashes.SHA256(),
                      label=None,
                  ),
              )
              envelope = base64.b64encode(json.dumps({
                  "encrypted_key": base64.b64encode(encrypted_key).decode("ascii"),
                  "nonce": base64.b64encode(nonce).decode("ascii"),
                  "ciphertext": base64.b64encode(ciphertext).decode("ascii"),
              }).encode("utf-8")).decode("ascii")
              print(f"ENCRYPTED_MULTIPART_BEGIN{envelope}ENCRYPTED_MULTIPART_END")
          elif operation == "complete":
              for item in payload:
                  key = object_key(item["key"])
                  parts = [oss2.models.PartInfo(int(p["part_number"]), p["etag"]) for p in item["parts"]]
                  bucket.complete_multipart_upload(key, item["upload_id"], parts)
                  print(f"completed {key}")
          else:
              raise SystemExit(f"unsupported operation: {operation}")
          PY
