name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis zip

      - name: Resolve version
        id: version
        run: |
          APP_VERSION="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "${APP_VERSION}" ]; then
            APP_VERSION="$(sed -n 's/.*\"version\": \"\\([^\"]*\\)\".*/\\1/p' package.json | head -n1)"
          else
            APP_VERSION="${APP_VERSION#v}"
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows distribution
        run: ./windows/build-win-dist.sh

      - name: Build NSIS installer
        run: |
          cd windows
          makensis -DAPP_VERSION=$APP_VERSION installer.nsi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meeting-float-sciter-win-x64-v${{ steps.version.outputs.app_version }}
          path: |
            dist/meeting-float-sciter-v${{ steps.version.outputs.app_version }}-win-x64.zip
            dist/Meeting-Float-${{ steps.version.outputs.app_version }}-Setup.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Meeting Float v${{ steps.version.outputs.app_version }}
          files: |
            dist/meeting-float-sciter-v${{ steps.version.outputs.app_version }}-win-x64.zip
            dist/Meeting-Float-${{ steps.version.outputs.app_version }}-Setup.exe
