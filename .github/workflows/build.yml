name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $refName = "${{ github.ref_name }}"
          $appVersion = $packageVersion
          if ("${{ github.ref_type }}" -eq "tag") {
            $appVersion = $refName.TrimStart('v')
          }
          if ("${{ github.ref_type }}" -eq "tag" -and $appVersion -ne $packageVersion) {
            Write-Error "Tag version v$appVersion does not match package.json version $packageVersion"
          }
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows Packages
        run: npm run dist:win

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meeting-float-desktop-win-x64-v${{ steps.version.outputs.app_version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Meeting Float Desktop v${{ steps.version.outputs.app_version }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
