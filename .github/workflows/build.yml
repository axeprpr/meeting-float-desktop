name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Resolve Version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $refName = "${{ github.ref_name }}"
          $appVersion = $packageVersion
          if ("${{ github.ref_type }}" -eq "tag") {
            $appVersion = $refName.TrimStart('v')
          }
          if ("${{ github.ref_type }}" -eq "tag" -and $appVersion -ne $packageVersion) {
            Write-Error "Tag version v$appVersion does not match package.json version $packageVersion"
          }
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows Packages
        run: npm run dist:win

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meeting-float-desktop-win-x64-v${{ steps.version.outputs.app_version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Meeting Float Desktop v${{ steps.version.outputs.app_version }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Set up Python
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Upload OSS mirror
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet oss2
          python <<'PY'
          import mimetypes
          import os
          from pathlib import Path

          import oss2

          endpoint = os.environ["ALIYUN_OSS_ENDPOINT"].strip()
          bucket_name = os.environ["ALIYUN_OSS_BUCKET"].strip()
          access_key_id = os.environ["ALIYUN_ACCESS_KEY_ID"].strip()
          access_key_secret = os.environ["ALIYUN_ACCESS_KEY_SECRET"].strip()
          ref_name = os.environ["GITHUB_REF_NAME"].strip()
          prefix = os.environ.get("ALIYUN_OSS_PREFIX", "").strip().strip("/")
          base_prefix = f"{prefix}/meeting-float-desktop" if prefix else "meeting-float-desktop"

          auth = oss2.Auth(access_key_id, access_key_secret)
          bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name)

          targets = [f"{base_prefix}/{ref_name}", f"{base_prefix}/latest"]
          patterns = ("*.exe", "*.blockmap", "latest.yml")
          files = []
          for pattern in patterns:
              files.extend(sorted(Path("release").glob(pattern)))
          files = [path for path in files if path.is_file()]
          if not files:
              raise SystemExit("no release artifacts found")

          urls = []
          for artifact in files:
              content_type, _ = mimetypes.guess_type(artifact.name)
              headers = {}
              if content_type:
                  headers["Content-Type"] = content_type
              for target in targets:
                  key = f"{target}/{artifact.name}"
                  bucket.put_object_from_file(key, str(artifact), headers=headers)
                  url = f"https://{bucket_name}.{endpoint}/{key}"
                  urls.append(url)
                  print(f"uploaded {artifact.name} -> {key}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n## OSS mirror\n")
                  for url in urls:
                      fh.write(f"- `{url}`\n")
          PY
