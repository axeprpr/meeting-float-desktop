name: Sign offline package uploads

on:
  workflow_dispatch:
    inputs:
      keys_json:
        description: JSON array of relative OSS object keys
        required: true
        type: string
      recipient_public_key:
        description: Base64-encoded PEM public key used to encrypt the result
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate limited upload URLs
        env:
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_PREFIX: ${{ secrets.ALIYUN_OSS_PREFIX }}
          KEYS_JSON: ${{ inputs.keys_json }}
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet cryptography oss2
          python <<'PY'
          import base64
          import json
          import os
          from pathlib import PurePosixPath

          import oss2
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          keys = json.loads(os.environ["KEYS_JSON"])
          if not isinstance(keys, list) or not 1 <= len(keys) <= 100:
              raise SystemExit("keys_json must contain 1-100 keys")

          prefix = os.environ.get("ALIYUN_OSS_PREFIX", "").strip().strip("/")
          endpoint = os.environ["ALIYUN_OSS_ENDPOINT"].strip()
          bucket_name = os.environ["ALIYUN_OSS_BUCKET"].strip()
          auth = oss2.Auth(
              os.environ["ALIYUN_ACCESS_KEY_ID"].strip(),
              os.environ["ALIYUN_ACCESS_KEY_SECRET"].strip(),
          )
          bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name)

          results = []
          for relative_key in keys:
              if not isinstance(relative_key, str):
                  raise SystemExit("every key must be a string")
              path = PurePosixPath(relative_key)
              if path.is_absolute() or ".." in path.parts or not path.parts:
                  raise SystemExit(f"invalid key: {relative_key}")
              key = "/".join(filter(None, (prefix, "ai-delivery", str(path))))
              results.append({
                  "relative_key": relative_key,
                  "key": key,
                  "upload_url": bucket.sign_url("PUT", key, 86400, slash_safe=True),
                  "download_url": f"https://{bucket_name}.{endpoint}/{key}",
              })

          payload = json.dumps(results, ensure_ascii=False).encode("utf-8")
          public_key = serialization.load_pem_public_key(
              base64.b64decode(os.environ["RECIPIENT_PUBLIC_KEY"])
          )
          data_key = AESGCM.generate_key(bit_length=256)
          nonce = os.urandom(12)
          ciphertext = AESGCM(data_key).encrypt(nonce, payload, None)
          encrypted_key = public_key.encrypt(
              data_key,
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )
          envelope = base64.b64encode(json.dumps({
              "encrypted_key": base64.b64encode(encrypted_key).decode("ascii"),
              "nonce": base64.b64encode(nonce).decode("ascii"),
              "ciphertext": base64.b64encode(ciphertext).decode("ascii"),
          }).encode("utf-8")).decode("ascii")
          print(f"ENCRYPTED_UPLOAD_URLS_BEGIN{envelope}ENCRYPTED_UPLOAD_URLS_END")
          PY
